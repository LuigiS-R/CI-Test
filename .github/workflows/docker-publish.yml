name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Provides a BuildKit builder that can create AMD64 images.
      - uses: docker/setup-buildx-action@v3

      # Authenticate with a Docker Hub access token stored in repository secrets.
      - uses: docker/login-action@v3
        with:
          username: luigisr03
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: luigisr03/ci-test:latest
